name: Build

# Em todo push/PR: teste de ponta a ponta no Windows e no Linux e build para os três sistemas.
# Em tag v* (ex.: v2.0.0): assina o .exe (quando a SignPath estiver configurada) e cria a release
# com Windows, Linux e macOS.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Não usar o nome VERSION: o MSBuild lê variáveis de ambiente como propriedades (Version).
  NBT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Teste de ponta a ponta
        run: dotnet run -c Release --project tests/Nbt.Smoke -- 64

  windows:
    needs: test
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Publicar
        shell: pwsh
        run: dotnet publish src/NetBackupTool.App -c Release -r win-x64 -o out -p:Version=$("$env:NBT_VERSION".TrimStart('v'))
      - name: Enviar artefato
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/NetBackupTool.exe
      # Assinatura pela SignPath Foundation (gratuita para open source).
      # Fica inativa até existir o segredo SIGNPATH_API_TOKEN e as variáveis SIGNPATH_* no repositório.
      - name: Assinar com SignPath
        if: github.ref_type == 'tag' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Usar o .exe assinado
        if: hashFiles('signed/NetBackupTool.exe') != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: signed/NetBackupTool.exe
          overwrite: true

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Publicar x64 e arm64
        run: |
          v="${NBT_VERSION#v}"
          for arch in x64 arm64; do
            dotnet publish src/NetBackupTool.App -c Release -r linux-$arch -o out/$arch -p:Version=$v
            mv out/$arch/NetBackupTool out/NetBackupTool-linux-$arch
            chmod +x out/NetBackupTool-linux-$arch
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/NetBackupTool-linux-*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Montar os pacotes .app
        run: |
          v="${NBT_VERSION#v}"
          mkdir -p out
          bash tools/make-macos-app.sh osx-arm64 "$v" out/NetBackupTool-macos-arm64.zip
          bash tools/make-macos-app.sh osx-x64 "$v" out/NetBackupTool-macos-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Suporte a Android do .NET
        run: dotnet workload install android
      - name: APK (download direto) e AAB (Play Store), assinados
        run: |
          v="${NBT_VERSION#v}"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/nbt.keystore"
          sign="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/nbt.keystore -p:AndroidSigningKeyAlias=netbackuptool -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD"
          common="-c Release -f net10.0-android -p:Version=$v -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT"
          dotnet publish src/NetBackupTool.Android $common $sign -p:AndroidPackageFormat=apk -o out/apk
          dotnet publish src/NetBackupTool.Android $common $sign -p:AndroidPackageFormat=aab -o out/aab
          mkdir -p dist
          cp out/apk/*-Signed.apk dist/NetBackupTool-android.apk
          cp out/aab/*-Signed.aab dist/NetBackupTool-android.aab
          rm -f "$RUNNER_TEMP/nbt.keystore"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* --title "Network Backup Tool ${{ github.ref_name }}" --generate-notes
